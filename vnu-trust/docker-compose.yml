services:
  postgres:
    image: postgres:16-alpine
    container_name: vnu_trust_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vnu_trust}
      POSTGRES_USER: ${DB_USER:-vnu_trust}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vnu_trust}
    # Chỉ nghe trên máy này. "5432:5432" mở ra MỌI giao diện mạng, kèm mật khẩu
    # dự phòng "vnu_trust" khi thiếu .env — ai cùng mạng cũng vào được CSDL.
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vnu_trust} -d ${DB_NAME:-vnu_trust}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [vnu_trust_net]

  # ---- Ứng dụng (P7, 13/11/2026) — chỉ bật khi gọi kèm profile:
  #   docker compose --profile app up --build
  # `docker compose up` trơn (dev.sh / test.sh dùng) vẫn chỉ bật Postgres như trước.
  # Chạy chế độ production: bắt buộc VERIFY_ONCHAIN=true (backend tự thoát nếu không).
  backend-ts:
    profiles: [app]
    build: ./backend
    env_file: [./chain.env, ./backend/.env]
    environment: { DB_HOST: postgres, DB_PORT: "5432", PORT: "4000", VERIFY_ONCHAIN: "true" }
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["127.0.0.1:4000:4000"]
    networks: [vnu_trust_net]

  backend-go:
    profiles: [app]
    build: ./backend-go
    env_file: [./chain.env, ./backend-go/.env]
    environment: { DB_HOST: postgres, DB_PORT: "5432", PORT: "4001", VERIFY_ONCHAIN: "true" }
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["127.0.0.1:4001:4001"]
    networks: [vnu_trust_net]

  frontend:
    profiles: [app]
    build: ./frontend
    depends_on: [backend-ts, backend-go]
    ports: ["127.0.0.1:8080:80"]
    networks: [vnu_trust_net]

volumes:
  pgdata: { name: vnu_trust_pgdata }

networks:
  vnu_trust_net: { name: vnu_trust_network, driver: bridge }
