# Giống proxy của Vite (vite.config.ts): giao diện đổi backend ngay lúc chạy qua
# /api-ts và /api-go mà không phải build lại.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  location /api-ts/ { proxy_pass http://backend-ts:4000/api/; proxy_set_header X-Forwarded-For $remote_addr; }
  location /api-go/ { proxy_pass http://backend-go:4001/api/; proxy_set_header X-Forwarded-For $remote_addr; }
  location /api/    { proxy_pass http://backend-ts:4000/api/; proxy_set_header X-Forwarded-For $remote_addr; }

  # Ứng dụng một trang: mọi đường dẫn khác trả index.html (liên kết /verify/<mã>#k=… vẫn mở được).
  location / { try_files $uri /index.html; }
}
